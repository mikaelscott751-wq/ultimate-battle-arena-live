// ---------- SOUND: generated music + effects (copyright-safe) ----------
let audioCtx = null, soundOn = true, musicTimer = null, musicStep = 0, nextNoteTime = 0;
function tone(freq, dur, type, gain, when, slideTo){
  if(!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime + (when||0);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(gain||0.06, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
function noiseBurst(dur, gain, when){
  if(!soundOn || !audioCtx || !audioCtx.createBuffer) return;
  const t = audioCtx.currentTime + (when||0);
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const g = audioCtx.createGain(); g.gain.value = gain||0.12;
  src.connect(g); g.connect(audioCtx.destination); src.start(t);
}
const sndPop   = ()=> tone(500, .16, 'sine', .07, 0, 90);
const sndTick  = ()=> tone(660, .07, 'sine', .05);
const sndShield= ()=> { tone(880,.12,'triangle',.07); tone(1320,.18,'triangle',.07,.08); };
const sndEvent = ()=> { tone(740,.1,'square',.05); tone(988,.14,'square',.05,.09); };
const sndRoar  = ()=> tone(90, .6, 'sawtooth', .10, 0, 38);
const sndHeart = ()=> { tone(58,.12,'sine',.14); tone(52,.1,'sine',.11,.16); };
const sndWin   = ()=> { [523,659,784,1046,1318].forEach((f,i)=> tone(f,.28,'triangle',.08, i*.12)); noiseBurst(.7,.10,.1); };
// background music sequencer: driving bass + sparkle, low volume
const BASS = [110,0,110,0,131,0,110,0, 98,0,98,0,147,0,165,0, 110,0,110,0,131,0,110,0, 196,0,165,0,147,0,131,0];
function startMusic(){
  if(!audioCtx || musicTimer) return;
  nextNoteTime = audioCtx.currentTime + 0.1; musicStep = 0;
  musicTimer = setInterval(()=>{
    if(!soundOn) return;
    const stepDur = 60/132/2; // 132 BPM, 8th notes
    while(nextNoteTime < audioCtx.currentTime + 0.35){
      const i = musicStep % BASS.length;
      const when = Math.max(0, nextNoteTime - audioCtx.currentTime);
      if(BASS[i]) tone(BASS[i], .16, 'sawtooth', .028, when);
      if(i % 8 === 0) tone(150, .12, 'sine', .10, when, 40); // kick
      if(i % 4 === 2) noiseBurst(.03, .015, when); // hat
      if(i % 16 === 14) tone(784, .2, 'triangle', .02, when);
      nextNoteTime += stepDur; musicStep++;
    }
  }, 120);
}

// ---------- GAME STATE ----------
const ARENA = { x:270, y:440, R0:238, Rmin:148 };
let balls = [], ghosts = [], particles = [], floaters = [], popups = [];
let roundNo = 0, themeIdx = 0;
let state = 'idle', stateTime = 0, gapAngle = 0, arenaR = ARENA.R0, elapsed = 0, gapHalf = 0.58;
let wins = {}, lastOut = [], winner = null, paused = false, lastTs = 0;
let eventTimer = 14, speedStorm = 0, gapBoost = 0, shake = 0, heartTimer = 0;
let milestonesHit = {}, commentary = 'Welcome to the Arena!';
const RING_COLORS = ['#ff5d5d','#ffb020','#57d95e','#4dc3ff','#c77dff','#ff8fab','#ffd166','#7ae0c3'];

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function popup(title, sub, color){
  popups.push({ title, sub:sub||'', color:color||'#ffd166', life:2.1, max:2.1 });
  commentary = title + (sub ? ' - ' + sub : '');
}
function tagOf(name){ return name.replace(/[^A-Za-z ]/g,'').split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase() || name.slice(0,3).toUpperCase(); }

function startRound(){
  const theme = THEMES[themeIdx];
  roundNo++;
  const picks = shuffle([...theme.items]).slice(0, PER_ROUND);
  balls = picks.map((p,i)=>{
    const a = Math.random()*Math.PI*2, d = Math.random()*(ARENA.R0-70);
    const sp = 1.6 + Math.random()*1.4, va = Math.random()*Math.PI*2;
    const b = { x:ARENA.x+Math.cos(a)*d, y:ARENA.y+Math.sin(a)*d,
      vx:Math.cos(va)*sp, vy:Math.sin(va)*sp,
      ring:RING_COLORS[i % RING_COLORS.length], alive:true, shield:false, boss:false, trail:[] };
    if(theme.key === 'flags'){ b.kind='flag'; b.code=p[0]; b.name=p[1]; b.emoji='🏳️'; b.r=22; }
    else if(theme.key === 'dinos'){ b.kind='dino'; b.emoji=p[0]; b.name=p[1]; b.hue=(i*47)%360; b.tag=p[1].replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase(); b.r=23; }
    else { b.kind='emoji'; b.emoji=p[0]; b.name=p[1]; b.r=21; }
    return b;
  });
  // one BOSS per round: bigger, gold ring
  const boss = balls[Math.floor(Math.random()*balls.length)];
  boss.boss = true; boss.r = Math.round(boss.r * 1.55); boss.ring = '#ffd700';
  ghosts = []; particles = []; floaters = []; lastOut = []; winner = null; popups = [];
  arenaR = ARENA.R0; elapsed = 0; gapHalf = 0.58; gapAngle = Math.random()*Math.PI*2;
  eventTimer = 13; speedStorm = 0; gapBoost = 0; shake = 0; milestonesHit = {};
  state = 'countdown'; stateTime = 0;
  popup(theme.title, 'Type your favourite in the chat!', theme.color);
  if(theme.key === 'dinos') setTimeout(()=>sndRoar(), 350);
}

function saveByShield(b){
  b.shield = false;
  const a = Math.atan2(b.y-ARENA.y, b.x-ARENA.x);
  b.x = ARENA.x + Math.cos(a)*(arenaR-60); b.y = ARENA.y + Math.sin(a)*(arenaR-60);
  b.vx = -b.vx; b.vy = -b.vy;
  popup('🛡️ SHIELD SAVE!', b.name + ' was saved by the shield!', '#7ae0c3');
  sndShield();
}

function eliminate(ball){
  ball.alive = false;
  // every elimination slightly speeds up the survivors - the fight keeps escalating
  for(const b of balls){ if(b.alive){ b.vx *= 1.015; b.vy *= 1.015; } }
  ghosts.push({ emoji:ball.emoji, kind:ball.kind, code:ball.code, x:ball.x, y:ball.y, life:1 });
  floaters.push({ x:ball.x, y:ball.y, text:'💥 ' + ball.name + ' OUT!', life:1.4 });
  lastOut.unshift(ball.name); lastOut = lastOut.slice(0,3);
  sndPop();
  if(ball.boss){ shake = 0.5; popup('💥 BOSS DOWN!', ball.name + ' has been eliminated!', '#ff5d5d'); noiseBurst(.4,.12); }
}

function endRound(w){
  winner = w; state = 'winner'; stateTime = 0;
  if(!wins[w.name]) wins[w.name] = { emoji:(w.kind==='flag' ? '🚩' : w.emoji), count:0 };
  wins[w.name].count++;
  popup('👑 ' + w.name.toUpperCase() + ' WINS!', 'Champion of Round ' + roundNo, '#ffd166');
  sndWin();
  for(let i=0;i<80;i++) particles.push({ x:ARENA.x, y:ARENA.y-40, vx:(Math.random()-.5)*7, vy:-Math.random()*6-2, life:1, c:RING_COLORS[i%RING_COLORS.length] });
}

function randomEvent(){
  const alive = balls.filter(b=>b.alive);
  if(alive.length < 3) return;
  const ev = Math.floor(Math.random()*3);
  if(ev === 0){ speedStorm = 6; popup('⚡ SPEED STORM!', 'Everything is 1.5x faster for 6 seconds!', '#ffd166'); }
  else if(ev === 1){
    const lucky = alive[Math.floor(Math.random()*alive.length)];
    if(!lucky.shield){ lucky.shield = true; popup('🛡️ SHIELD DROP!', lucky.name + ' got a shield!', '#7ae0c3'); sndShield(); }
    else { gapBoost = 6; popup('🕳️ DOUBLE GAP!', 'The exit is bigger for 6 seconds!', '#ff8fab'); }
  }
  else { gapBoost = 6; popup('🕳️ DOUBLE GAP!', 'The exit is bigger for 6 seconds!', '#ff8fab'); }
  sndEvent();
}

function checkMilestones(n){
  const marks = {20:'😲 ONLY 20 LEFT!', 10:'🔥 TOP 10!', 5:'⚡ FINAL 5!', 2:'😱 FINAL 2 - WHO WINS?'};
  if(marks[n] && !milestonesHit[n]){
    milestonesHit[n] = true;
    popup(marks[n], n===2 ? balls.filter(b=>b.alive).map(b=>b.name).join('  vs  ') : 'The battle is heating up!', '#ff5d7a');
    sndEvent();
    if(n === 5) shake = Math.max(shake, 0.25);
  }
}

function update(dt){
  if(paused) return;
  stateTime += dt;
  // popups + floaters always age
  popups.forEach(p=> p.life -= dt); popups = popups.filter(p=>p.life>0);
  floaters.forEach(f=> { f.y -= 34*dt; f.life -= dt; }); floaters = floaters.filter(f=>f.life>0);
  if(shake > 0) shake -= dt;

  if(state === 'countdown'){
    if(Math.floor(stateTime) !== Math.floor(stateTime - dt) && stateTime < 3) sndTick();
    if(stateTime >= 3){
      state = 'battle'; stateTime = 0;
      const boss = balls.find(b=>b.boss);
      if(boss) popup('👹 BOSS IN THE ARENA!', boss.name + ' is bigger than everyone!', '#ffd700');
    }
    return;
  }
  if(state === 'winner'){
    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=dt*0.7; });
    particles = particles.filter(p=>p.life>0);
    if(stateTime >= 5){ themeIdx = (themeIdx+1) % THEMES.length; startRound(); }
    return;
  }
  if(state !== 'battle') return;

  elapsed += dt;
  gapAngle += dt * 0.45;
  const aliveNow = balls.filter(b=>b.alive).length;
  // Retention mechanic: as players get eliminated, the exit opening gets SMALLER
  // and the arena tightens, so the final fight lasts longer and stays tense.
  gapHalf = 0.16 + (aliveNow / PER_ROUND) * 0.42 + (gapBoost > 0 ? 0.25 : 0);
  if(elapsed > 150) gapHalf += Math.min(0.30, (elapsed - 150) * 0.004); // sudden death safety
  const targetR = Math.min(ARENA.R0, 88 + aliveNow * 5.2);
  arenaR += (targetR - arenaR) * Math.min(1, dt * 0.45);
  let boost = 1 + Math.min(1.3, elapsed / 65);
  if(speedStorm > 0){ boost *= 1.5; speedStorm -= dt; }
  if(gapBoost > 0) gapBoost -= dt;

  if(elapsed > 150 && !milestonesHit.sd){ milestonesHit.sd = true; popup('⏰ SUDDEN DEATH!', 'The opening is growing again - someone WILL fall!', '#ff3b6b'); sndEvent(); }
  // random events keep the stream alive
  eventTimer -= dt;
  if(eventTimer <= 0){ randomEvent(); eventTimer = 13 + Math.random()*8; }
  // heartbeat in the final phase
  if(aliveNow <= 5){ heartTimer -= dt; if(heartTimer <= 0){ sndHeart(); heartTimer = 0.85; } }

  const alive = balls.filter(b=>b.alive);
  for(const b of alive){
    b.trail.push({x:b.x, y:b.y}); if(b.trail.length > 5) b.trail.shift();
    b.x += b.vx * boost; b.y += b.vy * boost;
    const dx = b.x - ARENA.x, dy = b.y - ARENA.y;
    const dist = Math.hypot(dx,dy) || 0.001;
    if(dist > arenaR - b.r){
      let da = Math.atan2(dy,dx) - gapAngle;
      while(da >  Math.PI) da -= Math.PI*2;
      while(da < -Math.PI) da += Math.PI*2;
      if(Math.abs(da) < gapHalf){
        if(dist > arenaR + 34){
          if(b.shield) saveByShield(b); else eliminate(b);
        }
      } else {
        const nx = dx/dist, ny = dy/dist;
        const dot = b.vx*nx + b.vy*ny;
        b.vx -= 2*dot*nx; b.vy -= 2*dot*ny;
        b.x = ARENA.x + nx*(arenaR - b.r); b.y = ARENA.y + ny*(arenaR - b.r);
      }
    }
  }
  const cur = balls.filter(b=>b.alive);
  for(let i=0;i<cur.length;i++) for(let j=i+1;j<cur.length;j++){
    const a = cur[i], b = cur[j];
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy), min = a.r+b.r;
    if(d > 0 && d < min){
      const nx = dx/d, ny = dy/d, overlap = (min-d)/2;
      a.x -= nx*overlap; a.y -= ny*overlap; b.x += nx*overlap; b.y += ny*overlap;
      const kx = a.vx-b.vx, ky = a.vy-b.vy, p = 2*(nx*kx + ny*ky)/2;
      a.vx -= p*nx; a.vy -= p*ny; b.vx += p*nx; b.vy += p*ny;
    }
  }
  ghosts.forEach(g=> g.life -= dt*0.9);
  ghosts = ghosts.filter(g=>g.life>0);

  const left = balls.filter(b=>b.alive);
  checkMilestones(left.length);
  if(left.length === 1) endRound(left[0]);
  else if(left.length === 0 && balls.length) endRound(balls[balls.length-1]);
}

// ---------- DRAW ----------
function drawBallFace(b, x, y, scale){
  const r = b.r * (scale||1);
  if(b.kind === 'flag'){
    const im = flagImg[b.code];
    if(im && im.complete && im.naturalWidth > 0){
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r-2, 0, 7); ctx.clip();
      ctx.drawImage(im, x-r+2, y-r+2, (r-2)*2, (r-2)*2);
      ctx.restore();
    } else {
      ctx.fillStyle = '#13224d'; ctx.font = 'bold ' + Math.round(r*0.72) + 'px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.code.toUpperCase(), x, y);
    }
  } else if(b.kind === 'dino'){
    ctx.font = Math.round(r*0.95) + 'px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.emoji, x, y - r*0.28);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold ' + Math.round(r*0.42) + 'px Arial';
    ctx.fillText(b.tag, x, y + r*0.55);
  } else {
    ctx.font = (r*1.05) + 'px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.emoji, x, y+1);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-.5)*10*shake*2, (Math.random()-.5)*10*shake*2);
  const theme = THEMES[themeIdx];
  ctx.fillStyle = '#0d1230'; ctx.fillRect(-20,-20,W+40,138);
  ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(26,26,8,0,7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'left'; ctx.textBaseline='alphabetic';
  ctx.fillText('LIVE', 42, 32);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166'; ctx.font = 'bold 21px Arial';
  ctx.fillText('ULTIMATE BATTLE ARENA LIVE', W/2, 34);
  ctx.fillStyle = theme.color; ctx.font = 'bold 30px Arial';
  ctx.fillText(theme.title, W/2, 74);
  ctx.fillStyle = '#aeb8e8'; ctx.font = 'bold 17px Arial';
  const aliveCount = balls.filter(b=>b.alive).length;
  ctx.fillText('ROUND ' + roundNo + '   •   ALIVE: ' + aliveCount + ' / ' + balls.length, W/2, 102);

  // arena - pulses red in final phase
  const finalPhase = state==='battle' && aliveCount <= 5 && aliveCount > 0;
  ctx.beginPath(); ctx.arc(ARENA.x, ARENA.y, arenaR+14, 0, 7);
  ctx.fillStyle = finalPhase ? '#3a1030' : '#11173a'; ctx.fill();
  ctx.beginPath(); ctx.arc(ARENA.x, ARENA.y, arenaR, 0, 7); ctx.fillStyle = '#171e47'; ctx.fill();
  ctx.beginPath();
  ctx.arc(ARENA.x, ARENA.y, arenaR, gapAngle+gapHalf, gapAngle + Math.PI*2 - gapHalf);
  ctx.strokeStyle = finalPhase ? '#ff3b6b' : theme.color; ctx.lineWidth = 7; ctx.stroke();

  for(const g of ghosts){
    ctx.globalAlpha = Math.max(0, g.life) * 0.7;
    if(g.kind === 'flag') drawBallFace({kind:'flag', code:g.code, r:20}, g.x, g.y, 0.9);
    else { ctx.font='26px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(g.emoji, g.x, g.y); }
  }
  ctx.globalAlpha = 1;

  for(const b of balls){
    if(!b.alive) continue;
    // trail
    b.trail.forEach((t,i)=>{
      ctx.globalAlpha = i / b.trail.length * 0.18;
      ctx.beginPath(); ctx.arc(t.x, t.y, b.r*0.8, 0, 7); ctx.fillStyle = b.ring; ctx.fill();
    });
    ctx.globalAlpha = 1;
    if(b.shield){ ctx.beginPath(); ctx.arc(b.x, b.y, b.r+6, 0, 7); ctx.strokeStyle = '#7ae0c3'; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7);
    ctx.fillStyle = b.kind==='dino' ? ('hsl(' + b.hue + ',60%,42%)') : '#f4f6ff'; ctx.fill();
    ctx.lineWidth = b.boss ? 5 : 3; ctx.strokeStyle = b.ring; ctx.stroke();
    drawBallFace(b, b.x, b.y, 1);
    if(b.boss){ ctx.fillStyle='#ffd700'; ctx.font='bold 10px Arial'; ctx.textAlign='center'; ctx.fillText('★ BOSS ★', b.x, b.y - b.r - 7); }
    if(aliveCount <= 10){
      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign='center';
      ctx.fillText(b.name, b.x, b.y + b.r + 9);
    }
  }

  // floating elimination texts
  for(const f of floaters){
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.fillStyle = '#ffb3b3'; ctx.font = 'bold 14px Arial'; ctx.textAlign='center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // POPUP (one at a time, newest on top)
  if(popups.length && state !== 'winner'){
    const p = popups[popups.length-1];
    const a = Math.min(1, p.life / 0.35, (p.max - p.life) / 0.18 + 0.2);
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    const pw = 470, ph = p.sub ? 86 : 62, px = (W-pw)/2, py2 = 196;
    ctx.fillStyle = 'rgba(8,10,28,.92)';
    ctx.beginPath(); ctx.roundRect(px, py2, pw, ph, 14); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = p.color; ctx.stroke();
    ctx.fillStyle = p.color; ctx.font = 'bold 27px Arial'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(p.title, W/2, py2 + 38);
    if(p.sub){ ctx.fillStyle = '#fff'; ctx.font = 'bold 17px Arial'; ctx.fillText(p.sub, W/2, py2 + 66); }
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if(state === 'countdown'){
    const n = 3 - Math.floor(stateTime);
    ctx.fillStyle = 'rgba(4,6,18,.55)'; ctx.fillRect(-20,118,W+40,560);
    ctx.fillStyle = '#ffd166'; ctx.font = 'bold 110px Arial';
    ctx.fillText(n > 0 ? n : 'GO!', ARENA.x, ARENA.y - 20);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Arial';
    ctx.fillText('TYPE YOUR FAVOURITE IN THE CHAT!', ARENA.x, ARENA.y + 60);
  }
  if(state === 'winner' && winner){
    ctx.fillStyle = 'rgba(4,6,18,.45)'; ctx.fillRect(-20,118,W+40,560);
    ctx.font = '64px Arial'; ctx.fillText('👑', ARENA.x, ARENA.y - 120);
    if(winner.kind === 'flag') drawBallFace(winner, ARENA.x, ARENA.y - 25, 2.2);
    else { ctx.font = '92px Arial'; ctx.fillText(winner.emoji, ARENA.x, ARENA.y - 25); }
    ctx.fillStyle = '#ffd166'; ctx.font = 'bold 40px Arial';
    ctx.fillText(winner.name.toUpperCase() + ' WINS!', ARENA.x, ARENA.y + 55);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial';
    ctx.fillText('Next battle starts soon...', ARENA.x, ARENA.y + 95);
    for(const p of particles){ ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 6, 6); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // bottom panel
  const py = 716;
  ctx.fillStyle = '#0d1230'; ctx.beginPath(); ctx.roundRect(14, py, W-28, 228, 14); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffd166'; ctx.font = 'bold 19px Arial';
  ctx.fillText('📣 ' + commentary.slice(0,52), 30, py+32);
  ctx.font = 'bold 20px Arial';
  ctx.fillText('🏆 CHAMPIONS', 30, py+64);
  const top = Object.entries(wins).map(([name,v])=>({name, emoji:v.emoji, count:v.count}))
                .sort((a,b)=>b.count-a.count).slice(0,4);
  ctx.font = '19px Arial';
  if(!top.length){ ctx.fillStyle = '#aeb8e8'; ctx.fillText('No champion yet - first battle!', 30, py+94); }
  top.forEach((t,i)=>{
    ctx.fillStyle = '#fff';
    ctx.fillText((i+1) + '.  ' + t.emoji + '  ' + t.name + '  -  ' + t.count + ' win' + (t.count>1?'s':''), 30, py+94 + i*28);
  });
  ctx.fillStyle = '#aeb8e8'; ctx.font = 'bold 16px Arial';
  ctx.fillText(lastOut.length ? ('Last out: ' + lastOut.join('  •  ')) : 'Last out: -', 30, py+214);
}

function frame(ts){
  const dt = Math.min(0.033, (ts - lastTs)/1000 || 0.016);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------- CONTROLS ----------
document.getElementById('startBtn').addEventListener('click', ()=>{
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  startMusic();
  document.getElementById('startOverlay').classList.add('hidden');
  startRound();
});
document.getElementById('pauseBtn').addEventListener('click', (e)=>{
  paused = !paused; e.target.textContent = paused ? '▶ Resume' : '⏸ Pause';
});
document.getElementById('themeBtn').addEventListener('click', ()=>{
  themeIdx = (themeIdx+1) % THEMES.length; startRound();
});
document.getElementById('soundBtn').addEventListener('click', (e)=>{
  soundOn = !soundOn; e.target.textContent = soundOn ? '🔊 Sound: On' : '🔇 Sound: Off';
});
document.getElementById('hideBtn').addEventListener('click', ()=>{
  document.getElementById('controls').classList.add('hidden');
});
requestAnimationFrame(frame);
</script>
